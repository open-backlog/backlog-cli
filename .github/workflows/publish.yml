name: Publish

# On every push to main: if package.json's version isn't on npm yet, the full check, then npm
# publish as open-backlog, then a tag v<version> on that commit. A push that doesn't change the
# version publishes nothing. So a release is: change "version", commit, push.
# It publishes through npm trusted publishing from open-backlog/backlog-cli (no token anywhere),
# with provenance: the npm page shows which commit and workflow built each version.
on:
  push:
    branches: [main]

permissions:
  # To push the v<version> tag.
  contents: write
  # For npm trusted publishing (OIDC) and provenance.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Is this version new?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The public registry, without auth: 200 published, 404 not yet, anything else stops.
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/open-backlog/$version")
          case "$status" in
            200) echo "open-backlog $version is already on npm: nothing to publish"; echo "new=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "open-backlog $version is new: checking, then publishing"; echo "new=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the npm registry answered $status for open-backlog $version"; exit 1 ;;
          esac
      - if: steps.version.outputs.new == 'true'
        run: npm ci
      - if: steps.version.outputs.new == 'true'
        run: npm run check
      - if: steps.version.outputs.new == 'true'
        run: npm publish --access public --provenance
      - if: steps.version.outputs.new == 'true'
        name: Tag the release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
