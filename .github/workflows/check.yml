name: Check

# On every push and pull request, on each Node LTS line the package supports: lint (ESLint and
# tsc), build, test (Vitest, with backlog-spec's examples as fixtures in test/fixtures/), and
# the smoke test (npm pack, a global install into a temporary prefix, ob --version, and
# import('open-backlog') without the CLI). It's `npm run check`, the same as locally.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
